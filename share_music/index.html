<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="preconnect" href="https://rumt-zh.com">
        <link rel="preconnect" href="https://comments.saobby.com">
        <link rel="dns-prefetch" href="https://captcha-v3.saobby.com">
        <script src="https://tam.cdn-go.cn/aegis-sdk/latest/aegis.min.js"></script>
        <script>
          if (typeof Aegis === 'function') {
            var aegis = new Aegis({
              id: 'XVx8Jfg1VPkL0x0ea2',
              uin: 'production',
              reportApiSpeed: true,
              reportAssetSpeed: true,
              spa: true,
            hostUrl: 'https://rumt-zh.com'
            });
          }
        </script>
        <script type="text/javascript">
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "nghuq29wf0");
        </script>
        <link rel="stylesheet" type="text/css" href="/static/css/common.css">
        <link rel="stylesheet" type="text/css" href="/static/css/wux.css">
        <link rel="preload" href="/static/css/katex.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <link rel="preload" href="/static/css/highlight.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript>
            <link rel="stylesheet" type="text/css" href="/static/css/katex.min.css">
            <link rel="stylesheet" type="text/css" href="/static/css/highlight.min.css">
        </noscript>
        <title>分享音乐</title>
    </head>
    <body>
        <div class="wux-container">
            <ul class="wux-breadcrumb">
                <li class="wux-breadcrumb-item"><a href="/">主页</a></li>
                <li class="wux-breadcrumb-item"><a href="/music">一起听歌</a></li>
                <li class="wux-breadcrumb-item">分享音乐</li>
            </ul>
            <div class="wux-typo">
                <div id="sharing-div">
                    <h2 class="mt">分享音乐</h2>
                    <span>请选择音乐平台</span>
                    <div class="wux-tab">
                        <input class="wux-tab-item" type="radio" name="tab-src" id="tab-nmusic" checked>
                        <label class="wux-tab-item" for="tab-nmusic">网易云音乐</label>
                        <div class="wux-tab-content">
                            <span>音乐页面链接:</span>
                            <input id="nmusic-url-input" type="text" class="wux-form-input wux-form-input-md" placeholder="音乐页面链接, 例如: https://music.163.com/#/song?id=2708984802">
                            <span>描述/推荐理由(选填,支持markdown,200字以内):</span>
                            <div class="gen-md-input" input-id="desc-input-0" input-rows="8" input-placeholder="描述/推荐理由(选填,支持markdown,200字以内)"></div>
                            <button type="button" class="wux-btn wux-btn-primary" onclick="share_music(0);" id="submit-btn-0"></button>
                            <span id="result-0" class="result"></span>
                        </div>
                        <input class="wux-tab-item" type="radio" name="tab-src" id="tab-file">
                        <label class="wux-tab-item" for="tab-file">直接上传音频文件</label>
                        <div class="wux-tab-content">

                        </div>
                    </div>
                </div>
                <div id="result-div" hidden>
                    <h2>提交成功</h2>
                    <span>你的请求<b>已在后台处理</b>,可能需要十几秒。</span><br>
                    <i>如果你已经登录, 处理完成后你将在通知中心看到一条消息。</i><br>
                    <span>当前状态: <code id="status">正在等待</code></span><br>
                    <button id="retry-btn" type="button" onclick="window.location.href='/share_music';" class="wux-btn wux-btn-primary"></button>
                </div>
                <div id="emotion-bar"></div>
                <div id="upload-image-progress-div"></div>
                <div id="scpc-v2" show-trigger="false"></div>
            </div>
        </div>
        <script src="/static/js/saobbyCaptchaV3.js" async></script>
        <script src="/static/js/check_browser.js" async></script>
        <script src="/static/js/common.js" defer></script>
        <script src="/static/js/paste_to_upload.js" defer></script>
        <script src="/static/js/emojis.js" defer></script>
        <script src="/static/js/emotion_bar.js" defer></script>
        <script src="/static/js/marked.min.js" defer></script>
        <script src="/static/js/katex.min.js" defer></script>
        <script src="/static/js/katex.umd.min.js" defer></script>
        <script src="/static/js/emoji.index.umd.js" defer></script>
        <script src="/static/js/highlight.min.js" defer></script>
        <script src="/static/js/marked_init.js" defer></script>
        <script src="/static/js/gen_md_input.js" defer></script>
        <script src="/static/js/share_music.js" defer></script>
    </body>
</html>
