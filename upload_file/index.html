<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <style>@media (prefers-color-scheme: dark){html,body{background-color:#1e1e1e;color:#fcfcfc;color-scheme:dark}}</style>
        <script src="/static/js/darkMode.js"></script>
        <meta name="viewport" content="width=device-width">
        <meta name="description" content="简单的图床或者网盘，可得到文件的下载直链，可上传25MB以内的文件">
        <link rel="preconnect" href="https://rumt-zh.com" crossorigin="">
        <link rel="preconnect" href="https://github-picbed.saobby.com" crossorigin="">
        <link rel="preconnect" href="https://captcha-v3.saobby.com" crossorigin="">
        <script src="https://tam.cdn-go.cn/aegis-sdk/latest/aegis.min.js"></script>
        <script>
          if (typeof Aegis === 'function') {
            var aegis = new Aegis({
              id: 'XVx8Jfg1VPkL0x0ea2',
              uin: localStorage.getItem('rum_uin') || 'anonymous',
              reportApiSpeed: true,
              reportAssetSpeed: true,
              spa: true,
            hostUrl: 'https://rumt-zh.com'
            });
          }
        </script>
        <script type="text/javascript">
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "nghuq29wf0");
        </script>
        <link rel="stylesheet" type="text/css" href="/static/css/common.css">
        <link rel="stylesheet" type="text/css" href="/static/css/wux.css">
        <title>文件上传</title>
    </head>
    <body>
        <div class="wux-container">
            <ul class="wux-breadcrumb">
                <li class="wux-breadcrumb-item"><a href="/">主页</a></li>
                <li class="wux-breadcrumb-item">图床/网盘</li>
            </ul>
            <div class="wux-typo">
                <h2 class="mt">文件上传</h2>
                <p>文件最大 25 MB, <b>上传后要等大约1分钟才能通过链接下载到文件</b></p>
                <input class="wux-form-upload" type="file" id="file"><br>
                <button class="wux-btn wux-btn-primary" type="button" onclick="upload_file().then();" id="upload-btn"><img src="/static/image/icon/upload-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">上传</span></button>
                <span id="upload_result" style="color:#aa0000"></span><br>
                <progress class="wux-progress" value="0" max="100" id="upload-progress" hidden></progress><br>
                <input class="wux-form-input wux-form-input-md" placeholder="文件链接会显示在这里" type="text" id="file_url" style="width: calc( 100% - 90px );display: inline-block;">
                <button onclick="copy_text(gebi('file_url').value,this);" type="button" class="wux-btn wux-btn-primary"><img src="/static/image/icon/copy-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">复制</span></button>
                <input class="wux-form-input wux-form-input-md" placeholder="图片markdown会显示在这里" type="text" id="markdown" style="width: calc( 100% - 90px );display: inline-block;">
                <button onclick="copy_text(gebi('markdown').value,this);" type="button" class="wux-btn wux-btn-primary"><img src="/static/image/icon/copy-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">复制</span></button>
                <div id="scpc-v2" show-trigger="false"></div>
            </div>
        </div>
        <script src="/static/js/saobbyCaptchaV3.js" async></script>
        <script src="/static/js/check_browser.js" async></script>
        <script src="/static/js/common.js" defer></script>
        <script src="/static/js/upload_file.js" defer></script>
    </body>
</html>
