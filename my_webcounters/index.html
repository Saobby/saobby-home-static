<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <style>@media (prefers-color-scheme: dark){html,body{background-color:#1e1e1e;color:#fcfcfc;color-scheme:dark}}</style>
        <script src="/static/js/darkMode.js"></script>
        <meta name="viewport" content="width=device-width">
        <link rel="preconnect" href="https://rumt-zh.com" crossorigin="">
        <link rel="preconnect" href="https://w.saobby.com" crossorigin="">
        <script src="https://tam.cdn-go.cn/aegis-sdk/latest/aegis.min.js"></script>
        <script>
          if (typeof Aegis === 'function') {
            var aegis = new Aegis({
              id: 'XVx8Jfg1VPkL0x0ea2',
              uin: localStorage.getItem('rum_uin') || 'anonymous',
              reportApiSpeed: true,
              reportAssetSpeed: true,
              spa: true,
            hostUrl: 'https://rumt-zh.com'
            });
          }
        </script>
        <script type="text/javascript">
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "nghuq29wf0");
            window.clarity("identify", localStorage.getItem('rum_uin') || 'anonymous');
        </script>
        <link rel="stylesheet" type="text/css" href="/static/css/common.css">
        <link rel="stylesheet" type="text/css" href="/static/css/wux.css">
        <title>我的计数器</title>
    </head>
    <body>
        <div class="wux-container">
            <ul class="wux-breadcrumb">
                <li class="wux-breadcrumb-item"><a href="/">主页</a></li>
                <li class="wux-breadcrumb-item"><a href="/webcounter">网页计数器</a></li>
                <li class="wux-breadcrumb-item">我的计数器</li>
            </ul>
            <div class="wux-typo">
                <h2 class="mt">我的计数器</h2>
                <input type="text" id="search-input" class="wux-form-input wux-form-input-md" placeholder="搜索 ID 或备注" style="width:calc( 100% - 100px );display:inline-block;">
                <button type="button" class="wux-btn wux-btn-primary" onclick="load_webcounters(0).then();" id="refresh-btn"><img src="/static/image/icon/search-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">搜索</span></button><br>
                <a href="/create_webcounter" target="_blank"><button class="wux-btn wux-btn-primary mt"><img src="/static/image/icon/plus-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">创建计数器</span></button></a>
                <hr>
                <div id="webcounters">
                    <div class="centered">
                        <span class="wux-loading"></span><br>
                        <span>加载中</span><br>
                        <span id="result" class="result"></span>
                    </div>
                </div>
                <div id="change-page-div" class="wux-btn-group mt"></div>
                <span>第<span id="page-index">1</span>/<span id="page-amount">-</span>页</span>
            </div>
        </div>
        <script src="/static/js/check_browser.js" async></script>
        <script src="/static/js/common.js" defer></script>
        <script src="/static/js/change_page_buttons.js" defer></script>
        <script src="/static/js/my_webcounters.js" defer></script>
    </body>
</html>
