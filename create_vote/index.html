<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <style>@media (prefers-color-scheme: dark){html,body{background-color:#1e1e1e;color:#fcfcfc;color-scheme:dark}}</style>
        <script src="/static/js/darkMode.js"></script>
        <meta name="viewport" content="width=device-width">
        <link rel="preconnect" href="https://rumt-zh.com" crossorigin="">
        <link rel="preconnect" href="https://vote.saobby.com" crossorigin="">
        <link rel="preconnect" href="https://captcha-v3.saobby.com" crossorigin="">
        <script src="https://tam.cdn-go.cn/aegis-sdk/latest/aegis.min.js"></script>
        <script>
          if (typeof Aegis === 'function') {
            var aegis = new Aegis({
              id: 'XVx8Jfg1VPkL0x0ea2',
              uin: localStorage.getItem('rum_uin') || 'anonymous',
              reportApiSpeed: true,
              reportAssetSpeed: true,
              spa: true,
            hostUrl: 'https://rumt-zh.com'
            });
          }
        </script>
        <script type="text/javascript">
            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window, document, "clarity", "script", "nghuq29wf0");
            window.clarity("identify", localStorage.getItem('rum_uin') || 'anonymous');
        </script>
        <link rel="stylesheet" type="text/css" href="/static/css/common.css">
        <link rel="stylesheet" type="text/css" href="/static/css/wux.css">
        <title>创建投票</title>
    </head>
    <body>
        <div class="wux-container">
            <ul class="wux-breadcrumb">
                <li class="wux-breadcrumb-item"><a href="/">主页</a></li>
                <li class="wux-breadcrumb-item">MD 投票工具</li>
            </ul>
            <div class="wux-typo">
                <h2 class="mt">创建一个投票</h2>
                <div id="config">
                    <span class="label">1. 标题:</span>
                    <input type="text" class="wux-form-input wux-form-input-md label" placeholder="标题" id="title">
                    <span class="label">2. 投票选项:</span>
                    <div id="options-div" class="pre-like label"></div>
                    <button class="wux-btn wux-btn-primary label" type="button" onclick="add_option();"><img src="/static/image/icon/plus-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">添加选项</span></button><br>
                    <span class="label">3. 在何时显示投票结果?</span><br>
                    <label><input class="wux-form-radios" type="radio" name="always-show-result" checked>投票后可查看结果</label><br>
                    <label><input class="wux-form-radios" type="radio" name="always-show-result" id="always-show-result">总是显示结果</label><br>
                    <span class="label">4. 怎样显示投票结果:</span><br>
                    <label><input type="checkbox" class="wux-form-checks" id="show-number" checked>显示投票人数</label><br>
                    <label><input type="checkbox" class="wux-form-checks" id="show-percent" checked>显示百分比</label><br>
                    <span class="label">5. 字体大小:</span>
                    <input type="number" class="wux-form-input wux-form-input-md label" placeholder="字体大小" value="16" min="1" id="font-size">
                    <span class="label">6. 字体颜色(点击下方色块使用浏览器的取色器):</span><br>
                    <input type="color" style="width: 64px; height: 64px;" value="#000000" id="font-color" placeholder="填6位16进制颜色代码,要带#号,如#aa0000表示红色" oninput="set_color();"><br>
                    <span class="label">如果你的浏览器不支持,请使用下方的滑块</span>
                    <div class="wux-row-md-3">
                        <div class="wux-col">
                            <label>R:<span id="color-r-val">0</span><input class="wux-form-range" type="range" value="0" min="0" max="255" id="color-r-range" oninput="preview_color();"></label><br>
                        </div>
                        <div class="wux-col">
                            <label>G:<span id="color-g-val">0</span><input class="wux-form-range" type="range" value="0" min="0" max="255" id="color-g-range" oninput="preview_color();"></label><br>
                        </div>
                        <div class="wux-col">
                            <label>B:<span id="color-b-val">0</span><input class="wux-form-range" type="range" value="0" min="0" max="255" id="color-b-range" oninput="preview_color();"></label><br>
                        </div>
                    </div>
                    <div style="width: 64px; height: 64px; background-color: #000000" id="color-preview-div" onclick="gebi('font-color').click();"></div>
                </div>
                <span class="label">7. 点击创建</span><br>
                <button class="wux-btn wux-btn-primary label" type="button" id="submit-btn" onclick="submit().then();">创建投票</button>
                <span id="result" class="result"></span>
                <textarea class="wux-form-input wux-form-input-md label" id="markdown" rows="5" placeholder="生成的Markdown会显示在这里"></textarea>
                <button class="wux-btn wux-btn-primary label" type="button" onclick="copy_text(gebi('markdown').value,this);"><img src="/static/image/icon/copy-white.svg" alt="" width="16px" height="16px" class="middle"><span class="middle">复制Markdown</span></button>
                <div id="scpc-v2" show-trigger="false"></div>
            </div>
        </div>
        <script src="/static/js/saobbyCaptchaV3.js" async></script>
        <script src="/static/js/check_browser.js" async></script>
        <script src="/static/js/common.js" defer></script>
        <script src="/static/js/create_vote.js" defer></script>
    </body>
</html>
