name: Build

on:
  push:
    branches: development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: "[Legacy] Install dependencies"
      run: |
        npm install --save-dev @babel/core @babel/cli @babel/preset-env
        npm install --global terser
        npm install --global cssnano-cli postcss-cli cssnano postcss

    - name: "[Legacy] Run Babel"
      run: npx babel ./static/js --out-dir ./static/js --presets=@babel/preset-env

    - name: "[Legacy] Minify Javascript"
      run: find ./static/js -name '*.js' -exec terser {} -o {} -m -c \;

    - name: "[Legacy] Minify CSS"
      run: find ./static/css -name '*.css' -exec postcss --use cssnano --preset default --no-map -o {} {} \;
    
    - name: "[v2] Install dependencies"
      run: npm ci
      working-directory: ./v2

    - name: "[v2] Build"
      run: npm run build
      working-directory: ./v2
    
    - name: "[v2] Place built files"
      working-directory: ./v2
      run: |
        mv dist/assets/ ..
        mv dist/src/pages/*/ ..
        cd ..
        rm -rf v2

    - name: Commit artifacts
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "[Github Action] Build"
        branch: production
        push_options: "--force"
        skip_checkout: true
